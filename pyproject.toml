[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cstos"
version = "0.1.0"
description = "CSTOS desktop application"
requires-python = ">=3.12"
dependencies = ["cs-ui>=0.1.1", "sqlmodel>=0.0.22"]

[project.scripts]
cstos = "cstos.bootstrap:run"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["projects", ".venv", "venv", "build", "dist", "data", "assets"]
pythonpath = ["src", "."]
addopts = "-ra"
